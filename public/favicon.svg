<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDC80" />
      <stop offset="25%" stop-color="#F77737" />
      <stop offset="50%" stop-color="#F56040" />
      <stop offset="75%" stop-color="#FD1D1D" />
      <stop offset="100%" stop-color="#833AB4" />
    </linearGradient>
    <linearGradient id="ai-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#0B0F17" stroke="url(#ig-grad)" stroke-width="3" />
  
  <!-- Outer camera ring -->
  <circle cx="50" cy="50" r="28" stroke="url(#ig-grad)" stroke-width="4" fill="none" opacity="0.9" />
  
  <!-- Lens Aperture / Iris Blades -->
  <circle cx="50" cy="50" r="16" stroke="url(#ai-lens)" stroke-width="3.5" fill="#101726" filter="url(#glow)" />
  <circle cx="50" cy="50" r="6" fill="url(#ai-lens)" />
  
  <!-- Optical sensor dot -->
  <circle cx="70" cy="30" r="4" fill="url(#ai-lens)" />
  
  <!-- AI Sparkle cross -->
  <path d="M50 18 L50 24 M50 76 L50 82 M18 50 L24 50 M76 50 L82 50" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>